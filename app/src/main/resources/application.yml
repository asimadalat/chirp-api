spring:
  application:
    name: chirp

  data:
    redis:
      host: "redis-10205.crce204.eu-west-2-3.ec2.cloud.redislabs.com"
      password: ${REDIS_PASSWORD}
      username: "default"
      port: 10205
      connect-timeout: 5000ms
      timeout: 2000ms

  datasource:
    url: jdbc:postgresql://aws-1-eu-west-2.pooler.supabase.com:5432/postgres #jdbc:postgresql://:5432/postgres
    username: postgres.qvrjpcfgrggrgnjzpkou #postgresdb.qvrjpcfgrggrgnjzpkou.supabase.co
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 12000000
      validation-timeout: 5000
      pool-name: SpringBootHikariCP
      data-source-properties:
        prepareThreshold: 5
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5

        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true
        show_sql: true

  mail:
    port: 587
    password: ${MAILGUN_PASSWORD}
    properties:
      mail:
        smtp:
          auth:  true
          starttls:
            enable: true

  rabbitmq:
    host: seal.lmq.cloudamqp.com
    password: ${RABBITMQ_PASSWORD}
    username: iieixhjf
    ssl:
      enabled: true
    virtual-host: iieixhjf
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 3
        prefetch: 10
        default-requeue-rejected: true
        retry:
          enabled: true
          initial-interval: 1000ms
          max-interval: 10000ms
          max-attempts: 3
          multiplier: 2


jwt:
  secret: ${JWT_SECRET_BASE64}

chirp:
  email:
    sender: chirp@asimorphic.com
    verification:
      expiry-hours: 24
    password-reset:
      expiry-minutes: 15

  security:
    api-key:
      header: x-api-key
      value: ${CHIRP_API_KEY}

nginx:
  require-proxy: true
  trusted-ips:
    - "127.0.0.1"
    - "::1"
    - "172.17.0.0/16"
    - "10.0.0.5/32"

server:
  port: 8080

supabase:
  url: "https://qvrjpcfgrggrgnjzpkou.supabase.co"
  service-key: ${SUPABASE_SERVICE_KEY}

firebase:
  credentials-path: "classpath:firebase/chirp-firebase-adminsdk.json"