<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${subject}">Chirp Email</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f6f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
        }

        .email-wrapper {
            width: 100%;
            padding: 40px 16px;
            background-color: #f5f6f7;
        }

        .email-container {
            max-width: 580px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 2px 14px rgba(0,0,0,0.06);
        }

        .content-section {
            padding: 40px 32px 45px 32px;
        }

        .content-section h1,
        .content-section h2,
        .content-section h3 {
            font-weight: 700;
            margin: 0 0 14px 0;
            color: #111;
        }

        .content-section p {
            font-size: 16px;
            line-height: 1.6;
            margin: 12px 0;
            color: #444;
        }

        .text-center { text-align: center; }
        .text-muted { color: #6c6c6c !important; }
        .mt-20 { margin-top: 20px; }
        .mt-30 { margin-top: 30px; }
        .mb-0 { margin-bottom: 0; }
        .divider {
            border-top: 1px solid #e6e6e6;
            margin-top: 34px;
            padding-top: 26px;
        }

        .button {
            display: inline-block;
            padding: 14px 34px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            background: linear-gradient(90deg, #0066ff, #4a8dff);
        }

        .button-danger {
            background: linear-gradient(90deg, #e63946, #d62839);
        }

        @media only screen and (max-width: 600px) {
            .content-section {
                padding: 28px 22px 34px 22px;
            }

            .button, .button-danger {
                width: 100% !important;
                display: block !important;
            }
        }
    </style>
</head>

<body>

<div class="email-wrapper">

    <div class="email-container">

        <!-- HEADER -->
        <div th:replace="~{emails/header :: header}"></div>

        <!-- CONTENT -->
        <div class="content-section">
            <th:block th:replace="${content}"></th:block>
        </div>

        <!-- FOOTER -->
        <div th:replace="~{emails/footer :: footer}"></div>

    </div>
</div>

</body>
</html>
